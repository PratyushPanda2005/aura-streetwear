        - generic [ref=f28e22]:
          - heading "Charanjeet Singh" [level=1] [ref=f28e23]
          - generic [ref=f28e24]:
            - paragraph [ref=f28e25]: Charanjeet Singh is a contemporary artist whose creations echo the whispers of history and advocate for water conservation. Drawing inspiration from the ancient step wells of India and the rich tradition of Mughal miniature paintings, Singh seamlessly weaves together these influences to convey a crucial message about the preservation of water and the timeless lessons of history.
            - paragraph [ref=f28e26]: EkChitra holds eleven works by Charanjeet Singh, in acrylic on paper, in two sizes, 16.5 x 12 inches and 15 x 11 inches. Each is shown in full under Selected works below, with its own title, medium and size.
            - paragraph [ref=f28e27]: Charanjeet Singh is represented by EkChitra in Hyderabad. Through the gallery's art advisory and bespoke sourcing, their work can be placed in homes, offices and institutions; to see a piece in person or ask what is available, enquire about any work below.
