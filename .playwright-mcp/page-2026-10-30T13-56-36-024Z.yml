    - generic [ref=f27e26]:
      - region [ref=f27e27]:
        - heading "Our story." [level=2] [ref=f27e28]
        - paragraph [ref=f27e31]: EkChitra was founded with a vision to bridge the gap between exceptional contemporary Indian artists and art enthusiasts worldwide.
        - generic [ref=f27e40]:
          - paragraph [ref=f27e43]: "Our journey began with a simple belief: that art has the power to transform spaces, inspire minds, and connect souls."
          - paragraph [ref=f27e46]: Today, we proudly showcase a diverse collection of contemporary artworks, from bold abstracts to serene landscapes, each piece carefully curated to bring beauty and meaning into your life.
      - region "How we work" [ref=f27e50]:
        - list [ref=f27e51]:
          - listitem [ref=f27e52]:
            - paragraph [ref=f27e54]: ( How we work 01 )
            - generic [ref=f27e55]:
              - heading "We begin with looking." [level=3] [ref=f27e56]
              - paragraph [ref=f27e57]:
                - generic [ref=f27e58]: Curiosity
                - text: Every exhibition begins with an idea, and every visit begins with curiosity — you don’t need to know about art to feel at home here.
          - listitem [ref=f27e59]:
            - paragraph [ref=f27e61]: ( How we work 02 )
            - generic [ref=f27e62]:
              - heading "Every work belongs to a larger story." [level=3] [ref=f27e63]
              - paragraph [ref=f27e64]:
                - generic [ref=f27e65]: Context
                - text: From temple carvings and cinema posters to family photographs, textiles and handwritten signs, visual culture has always shaped how we understand identity, memory and belonging.
          - listitem [ref=f27e66]:
            - paragraph [ref=f27e68]: ( How we work 03 )
            - generic [ref=f27e69]:
              - heading "Art becomes meaningful when it enters a life." [level=3] [ref=f27e70]
              - paragraph [ref=f27e71]:
                - generic [ref=f27e72]: Connection
                - text: Art selection, curation and placement shaped around a particular space, and considered guidance for starting, refining or growing a collection.
          - listitem [ref=f27e73]:
            - paragraph [ref=f27e75]: ( How we work 04 )
            - generic [ref=f27e76]:
              - heading "A gallery is a place to exchange ideas." [level=3] [ref=f27e77]
              - paragraph [ref=f27e78]:
                - generic [ref=f27e79]: Conversation
                - text: Knowledgeable without being intimidating, and always open to a conversation — amplifying the voices of artists so their stories reach diverse audiences.
