                        - generic [ref=e207]: w
                  - paragraph [ref=e208]: Follow Riya, a photographer in Pune, and Arjun's wedding video crew. Both are examples.
              - listitem [ref=e209]:
                - article [ref=e211]:
                  - generic [ref=e212]:
                    - img "Layered blue mountain ranges fading into the sky" [ref=e214]
                    - generic [ref=e215]: "[ Step 01 ]"
                  - generic [ref=e216]:
                    - heading "Enquiry" [level=3] [ref=e217]
                    - generic [ref=e218]: 01 / 07
                  - paragraph [ref=e219]: On Instagram, Krew replies with your “starting from” rates and portfolio, asks the date, budget and type of work, then hands the chat to you. It never agrees a price.
              - listitem [ref=e220]:
                - article [ref=e221]:
                  - generic [ref=e222]:
                    - img "Sand dunes below mountains under a cloudy sky" [ref=e224]
                    - generic [ref=e225]: "[ Step 02 ]"
                  - generic [ref=e226]:
                    - heading "Quote" [level=3] [ref=e227]
                    - generic [ref=e228]: 02 / 07
                  - paragraph [ref=e229]: Send the quote as a link. Your client accepts by typing their name and ticking a box, and Krew keeps a record of exactly what they accepted.
              - listitem [ref=e230]:
                - article [ref=e231]:
                  - generic [ref=e232]:
                    - img "White sand stretching to a mountain range" [ref=e234]
                    - generic [ref=e235]: "[ Step 03 ]"
                  - generic [ref=e236]:
                    - heading "Advance" [level=3] [ref=e237]
                    - generic [ref=e238]: 03 / 07
                  - paragraph [ref=e239]: Ask for the advance with a payment link or your UPI ID. If it isn't paid two days before the shoot, Krew marks the job at risk.
              - listitem [ref=e240]:
                - article [ref=e241]:
                  - generic [ref=e242]:
                    - img "Golden plains below snow-capped mountains" [ref=e244]
                    - generic [ref=e245]: "[ Step 04 ]"
                  - generic [ref=e246]:
                    - heading "Work" [level=3] [ref=e247]
                    - generic [ref=e248]: 04 / 07
                  - paragraph [ref=e249]: Turn the job into tasks from a template and assign them to your crew. Each person sees only the jobs and tasks you give them, and you choose who can reply to clients.
              - listitem [ref=e250]:
                - article [ref=e251]:
                  - generic [ref=e252]:
                    - img "Dark hills at dusk with the sea beyond" [ref=e254]
                    - generic [ref=e255]: "[ Step 05 ]"
                  - generic [ref=e256]:
                    - heading "Review" [level=3] [ref=e257]
                    - generic [ref=e258]: 05 / 07
                  - paragraph [ref=e259]: Share drafts by link. Clients comment on the exact second of a video or a spot on a photo, then approve, and that version is locked.
              - listitem [ref=e260]:
                - article [ref=e261]:
                  - generic [ref=e262]:
                    - img "The moon above pale dunes at dusk" [ref=e264]
                    - generic [ref=e265]: "[ Step 06 ]"
                  - generic [ref=e266]:
                    - heading "Invoice" [level=3] [ref=e267]
                    - generic [ref=e268]: 06 / 07
                  - paragraph [ref=e269]: Raise a GST invoice, or a plain one if you aren't registered, with a payment link for UPI or card.
              - listitem [ref=e270]:
