        - generic [ref=f24e848]:
          - heading "Here's what you need to consider before partnering with us." [level=2] [ref=f24e849]
          - list [ref=f24e851]:
            - listitem [ref=f24e852]:
              - button [ref=f24e853] [cursor=pointer]:
                - heading "Who will actually be working on our project?" [level=3] [ref=f24e854]
              - generic [ref=f24e857]:
                - paragraph [ref=f24e858]: Huy leads every engagement from strategy, creative direction, and your primary point of contact throughout.
                - paragraph [ref=f24e859]: Depending on scope, a carefully selected team of collaborators supports on design and development. The level of care and craft stays consistent, regardless of project size.
            - listitem [ref=f24e860]:
              - button [ref=f24e861] [cursor=pointer]:
                - heading "How long do your projects usually take?" [level=3] [ref=f24e862]
              - generic [ref=f24e865]:
                - paragraph [ref=f24e866]: Most projects run 10-14 weeks end-to-end.
                - paragraph [ref=f24e867]: Timelines can flex based on scope, but we set milestones from day one so there are no surprises.
            - listitem [ref=f24e868]:
              - button [ref=f24e869] [cursor=pointer]:
                - heading "How do you communicate and manage work?" [level=3] [ref=f24e870]
              - generic [ref=f24e873]:
                - paragraph [ref=f24e874]: We keep things simple and transparent with a dedicated Notion portal to manage our project (timelines and deliverables).
                - paragraph [ref=f24e875]: Most of the time you'll receive async Loom updates and weekly communication via Slack or WhatsApp. We can also integrate with your tools so the process stays structured yet flexible.Synchronous calls are typically scheduled to review important decisions or milestones of the project.
            - listitem [ref=f24e876]:
              - button [ref=f24e877] [cursor=pointer]:
                - heading "What do you need to start working together?" [level=3] [ref=f24e878]
              - generic [ref=f24e881]:
                - paragraph [ref=f24e882]: We'll discuss your specific needs during a discovery call and we will provide a tailored proposal to match your project needs.
                - paragraph [ref=f24e883]:
                  - text: Afterwards, we just need a signed contract proposal and the initial project deposit payment. That’s all. We make onboarding fast so we can get to work ASAP. Ready to get started?
                  - link "Book a call with Huy" [ref=f24e884] [cursor=pointer]:
                    - /url: https://cal.com/byhuy/project-intro-call?duration=45
            - listitem [ref=f24e885]:
              - button [ref=f24e886] [cursor=pointer]:
                - heading "What happens after launch?" [level=3] [ref=f24e887]
              - generic [ref=f24e890]:
                - paragraph [ref=f24e891]: We provide 90 days of hands-on support to make sure everything runs smoothly and your brand is set to steal the spotlight. You’ll also get tailored documentation and CMS training videos so non-technical team members can update the site with ease.
                - paragraph [ref=f24e892]: After that, you’re fully equipped to manage things in-house, and if you ever want ongoing support, we offer care plans tailored to your needs.
            - listitem [ref=f24e893]:
              - button [ref=f24e894] [cursor=pointer]:
                - heading "Can you handle branding, design and development?" [level=3] [ref=f24e895]
              - generic [ref=f24e898]:
                - paragraph [ref=f24e899]: Absolutely. Our specialty is delivering all three under one roof and focus on what matters most to you and your business.
                - paragraph [ref=f24e900]: Whether you’re a team of 10 or a brand operating in 50 countries, your narrative, identity, visuals, and functionality are aligned from day one, creating a cohesive final experience.
            - listitem [ref=f24e901]:
              - button [ref=f24e902] [cursor=pointer]:
                - heading "What is the project investment?" [level=3] [ref=f24e903]
              - paragraph [ref=f24e907]: Project investment starts from $15k USD with most projects ranging from $25k - $50k depending on scope and project complexity.
