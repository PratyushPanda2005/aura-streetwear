            - listitem [ref=f24e90]:
              - heading "All in or nothing" [level=2] [ref=f24e91]
              - paragraph [ref=f24e92]: We take on fewer projects so we can give each one everything. When we commit to your brand, we're fully present, fully invested, fully responsible for the result.
            - listitem [ref=f24e93]:
              - heading "Human-first, always" [level=2] [ref=f24e94]
              - paragraph [ref=f24e95]: Behind every brand is a person with a real story and real stakes. We never lose sight of that. The most powerful digital experiences are the ones that feel unmistakably human.
            - listitem [ref=f24e96]:
              - heading "Intention over speed" [level=2] [ref=f24e97]
              - paragraph [ref=f24e98]: Rushed work compounds into regret. We move at the pace the work demands. Every layer earns its place before we move to the next.
