        - generic [ref=e31]:
          - heading "Ron Arad" [level=1] [ref=e32]
          - generic [ref=e33]:
            - paragraph [ref=e34]:
              - strong [ref=e35]: Ron Arad
              - text: is an Israeli designer born in Tel Aviv in 1951. He studied at the Jerusalem Art Academy and at the Architectural Association in London.
            - paragraph [ref=e36]
            - paragraph [ref=e37]: His objects are the result of a constant experimentation of raw materials such as steel, aluminium or polyamide, which he distorts into sinusoidal, elliptical and oval forms. Alongside his studio work, Arad designs for many leading international companies including Kartell, Vitra, Moroso, Fiam, Driade, Alessi, Cappellini, Cassina, WMF and Magis amongst many others.
            - paragraph [ref=e38]
            - paragraph [ref=e39]:
              - text: He was awarded the 2011 London Design Week Medal for design excellence and became an Academician of the Royal Academy of Arts in 2013. Ron Arad has designed a number of public art pieces such as the
              - emphasis [ref=e40]: Vortex
              - text: in Seoul, South Korea, and the
              - emphasis [ref=e41]: Kesher Sculpture
              - text: at the Tel Aviv University, Israel.
            - paragraph [ref=e42]
            - paragraph [ref=e43]: Arad’s work is held in public collections worldwide including The Metropolitan Museum of Art in New York, Musée d'Art Moderne and Musée des Arts Décoratifs in Paris, Musée des Beaux-Arts de Montréal and the Victoria and Albert Museum in London, among others. He has also designed various public artworks, some which can be seen in Tel Aviv, Seoul, Toronto and London. He has collaborated with brands such as Adidas, Samsung, Kenzo, Fiat, and many more. In 2013, Arad became an Academician of the Royal Academy of Arts.
        - img "Ron Arad" [ref=e45]
