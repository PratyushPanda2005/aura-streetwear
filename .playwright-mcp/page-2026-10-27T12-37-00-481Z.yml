    - main [ref=f18e219]:
      - heading [level=1] [ref=f18e221]:
        - generic [aria-hidden] [ref=f18e227]: Goodman
        - generic [aria-hidden] [ref=f18e233]: Advisory
      - generic [ref=f18e238]:
        - paragraph [ref=f18e239]: "Rooted in the 60-year legacy of Goodman Gallery, with locationsin South Africa, London, and New York, Goodman Advisory guides collectors and institutions in building thoughtful, enduring art collections shaped by global perspectives and rigorous market insight. We provide bespoke advisory services tailored to each client’s objectives, supporting every stage of the collecting process: from research, sourcing, and acquisition to governance, collection management, conservation, institutional partnerships, loans, deaccessioning, and long-term stewardship."
        - paragraph
        - paragraph [ref=f18e240]:
          - strong [ref=f18e241]: ‘
          - text: Barloworld operates in 11 African Countries and employs thousands of staff across multiple sectors on the Continent. We approached Goodman to build a representative and relevant art collection for the business as part of our broader vision for the company. Goodman advised on a strategy to deaccession multiple historical artworks and bring the focus into the contemporary field. The collection now includes living artists from across the Continent working in many different disciplines and was curated to align with our core values and external programme partnerships. We are proud to host one of the most important corporate collections of African art in the country
          - strong [ref=f18e242]: ’ – Dominic Sewela, CEO, Barloworld
      - generic [ref=f18e243]: Our approach combines discretion, transparency, and deep international relationships to ensure that each collection is not only culturally meaningful, but responsibly developed and sustained for the future.
      - generic [ref=f18e246]:
        - generic [ref=f18e249]:
          - paragraph [ref=f18e250]:
            - strong [ref=f18e251]: ‘
            - text: We approached Goodman to build an iconic corporate collection of artwork by leading artists from the African Continent and the Diaspora for our New York HQ. Being in a city like New York, we needed the collection to be exceptional at every level. Goodman was able to secure works by leading artists from galleries across the US, Europe and Africa. Their approach was tailored to our needs, identifying bespoke and ambitious solution where space allowed. This high quality collection has received much praise.
            - strong [ref=f18e252]: ’
          - paragraph [ref=f18e253]:
            - strong [ref=f18e254]: – Wealth Management Firm, New York
        - img "Goodman Advisory" [ref=f18e258]
      - link "Speak with Our Advisory Team With offices and networks in London and New York, the world’s leading art market centres, we combine global reach with strong on-the-ground expertise. Connect with our Goodman Advisory specialists Connect with Goodman Advisory specialists in the UK, US, and South Africa." [ref=f18e260] [cursor=pointer]:
