            - paragraph [ref=e711]: Tout commence dans l'effervescence des cours de récréation des années 80, avant que notre vision ne s'affirme en 2009 avec l'Ekiden 2000. La OG2K s'inspire de ce riche passé pour étendre notre gamme running, offrant une silhouette qui traverse les époques.Aux côtés de l’emblématique RR2K, elle s'impose aujourd'hui comme l'atout maître des fans de la tendance "Y2K". Son design épuré mise sur une esthétique minimaliste sans jamais négliger le confort, le tout proposé à un prix très accessible. C’est la paire idéale pour ceux qui recherchent un style rétro-technique précis et une légèreté absolue au quotidien.
