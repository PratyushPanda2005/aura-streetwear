          - paragraph [ref=f30e53]: Charanjeet Singh is a contemporary artist whose creations echo the whispers of history and advocate for water conservation.
          - generic [ref=f30e54]:
            - paragraph [ref=f30e55]: Drawing inspiration from the ancient step wells of India and the rich tradition of Mughal miniature paintings, Singh seamlessly weaves together these influences to convey a crucial message about the preservation of water and the timeless lessons of history.
            - paragraph [ref=f30e56]: Charanjeet Singh is represented by EkChitra in Hyderabad. Through the gallery's art advisory and bespoke sourcing, their work can be placed in homes, offices and institutions; to see a piece in person or ask what is available, enquire about any work below.
