      - region "How we work" [ref=f39e41]:
        - list [ref=f39e42]:
          - listitem [ref=f39e43]:
            - paragraph [ref=f39e45]: ( How we work 01 )
            - generic [ref=f39e46]:
              - heading "We begin with looking." [level=3] [ref=f39e47]
              - paragraph [ref=f39e48]:
                - generic [ref=f39e49]: Curiosity
                - text: Every exhibition begins with an idea, and every visit begins with curiosity — you don’t need to know about art to feel at home here.
          - listitem [ref=f39e50]:
            - paragraph [ref=f39e52]: ( How we work 02 )
            - generic [ref=f39e53]:
              - heading "Every work belongs to a larger story." [level=3] [ref=f39e54]
              - paragraph [ref=f39e55]:
                - generic [ref=f39e56]: Context
                - text: From temple carvings and cinema posters to family photographs, textiles and handwritten signs, visual culture has always shaped how we understand identity, memory and belonging.
          - listitem [ref=f39e57]:
            - paragraph [ref=f39e59]: ( How we work 03 )
            - generic [ref=f39e60]:
              - heading "Art becomes meaningful when it enters a life." [level=3] [ref=f39e61]
              - paragraph [ref=f39e62]:
                - generic [ref=f39e63]: Connection
                - text: Art selection, curation and placement shaped around a particular space, and considered guidance for starting, refining or growing a collection.
          - listitem [ref=f39e64]:
            - paragraph [ref=f39e66]: ( How we work 04 )
            - generic [ref=f39e67]:
              - heading "A gallery is a place to exchange ideas." [level=3] [ref=f39e68]
              - paragraph [ref=f39e69]:
                - generic [ref=f39e70]: Conversation
                - text: Knowledgeable without being intimidating, and always open to a conversation — amplifying the voices of artists so their stories reach diverse audiences.
