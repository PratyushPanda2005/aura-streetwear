          - paragraph [ref=f3e300]: Dalkhafine est une artiste franco-canadienne, travaillant principalement sur des collaborations avec des marques, que ce soit dans l’illustration, le motion design ou l’art mural. Son univers coloré et résolument positif met en scène des personnages expressifs qui évoluent dans des décors vibrants, souvent empreints de nostalgie.
