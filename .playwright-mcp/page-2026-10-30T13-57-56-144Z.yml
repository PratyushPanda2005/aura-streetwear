    - generic [ref=f28e26]:
      - region [ref=f28e27]:
        - heading "Our story." [level=2] [ref=f28e28]
        - paragraph [ref=f28e31]: EkChitra was founded with a vision to bridge the gap between exceptional contemporary Indian artists and art enthusiasts worldwide.
        - generic [ref=f28e40]:
          - paragraph [ref=f28e43]: "Our journey began with a simple belief: that art has the power to transform spaces, inspire minds, and connect souls."
          - paragraph [ref=f28e46]: Today, we proudly showcase a diverse collection of contemporary artworks, from bold abstracts to serene landscapes, each piece carefully curated to bring beauty and meaning into your life.
      - region "How we work" [ref=f28e50]:
        - list [ref=f28e51]:
          - listitem [ref=f28e52]:
            - paragraph [ref=f28e54]: ( How we work 01 )
            - generic [ref=f28e55]:
              - heading "We begin with looking." [level=3] [ref=f28e56]
              - paragraph [ref=f28e57]:
                - generic [ref=f28e58]: Curiosity
                - text: Every exhibition begins with an idea, and every visit begins with curiosity — you don’t need to know about art to feel at home here.
          - listitem [ref=f28e59]:
            - paragraph [ref=f28e61]: ( How we work 02 )
            - generic [ref=f28e62]:
              - heading "Every work belongs to a larger story." [level=3] [ref=f28e63]
              - paragraph [ref=f28e64]:
                - generic [ref=f28e65]: Context
                - text: From temple carvings and cinema posters to family photographs, textiles and handwritten signs, visual culture has always shaped how we understand identity, memory and belonging.
          - listitem [ref=f28e66]:
            - paragraph [ref=f28e68]: ( How we work 03 )
            - generic [ref=f28e69]:
              - heading "Art becomes meaningful when it enters a life." [level=3] [ref=f28e70]
              - paragraph [ref=f28e71]:
                - generic [ref=f28e72]: Connection
                - text: Art selection, curation and placement shaped around a particular space, and considered guidance for starting, refining or growing a collection.
          - listitem [ref=f28e73]:
            - paragraph [ref=f28e75]: ( How we work 04 )
            - generic [ref=f28e76]:
              - heading "A gallery is a place to exchange ideas." [level=3] [ref=f28e77]
              - paragraph [ref=f28e78]:
                - generic [ref=f28e79]: Conversation
                - text: Knowledgeable without being intimidating, and always open to a conversation — amplifying the voices of artists so their stories reach diverse audiences.
