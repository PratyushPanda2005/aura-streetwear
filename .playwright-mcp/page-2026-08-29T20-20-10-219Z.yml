          - generic [ref=f24e148]: C'EST QUOI?
          - heading "Les métiers et formations qui font briller la scène indé d'ici." [level=3] [ref=f24e149]
          - paragraph [ref=f24e150]: Le milieu de la diffusion indépendante au Québec regorge d'opportunités pour celles et ceux qui veulent contribuer à faire vibrer la culture vivante et engagée d'ici. Et il n'attend que toi! Des salles intimes, des scènes mytiques, proches de ses artistes et de son public. Parce que derrière chaque rideau levé, il y a des métiers qui comptent.
