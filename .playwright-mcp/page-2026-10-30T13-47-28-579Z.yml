          - generic [ref=f22e205]:
            - paragraph [ref=f22e207]: The night had its own rhythm, and Naik thrived in it. Driving through the bustling lanes, he mingled with people from every corner of society. From street hustlers to late-night dreamers, every interaction gave Naik a crash course in humanity—particularly the quirky behaviors that surface after dark. For Naik, the city wasn’t just alive; it was a living, breathing storybook, begging to be explored.
            - paragraph [ref=f22e209]: But Naik wasn’t all work and no play. Oh no! This guy had a rebellious streak a mile wide. Selling movie tickets in black? Check. Betting on bike races? Absolutely. Hanging out with his crew who loved rapping and street culture?
            - paragraph [ref=f22e211]: Of course! Yet, amid all the street smarts and mischief, Naik had a burning love for art. Shaping his creative journey from an early age. His vivid color palette and attention to detail, a signature of his work, were deeply rooted in the vibrant world of his childhood. Growing up surrounded by the lively hues of the Lambada community and the intricate, colorful embroideries crafted by his mother, he absorbed a love for brightness and energy.
