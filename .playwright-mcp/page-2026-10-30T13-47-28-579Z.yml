        - generic [ref=f22e52]:
          - paragraph [ref=f22e53]:
            - generic "Rajesh Naik’s life is a thrilling blend of street smarts, rebellion, and artistic brilliance—crafted in the chaotic symphony of Hyderabad’s Old City. Born to an auto driver, Naik didn’t just watch life pass by from the sidelines. By the time he was in seventh grade, he was behind the wheel of his father’s autorickshaw. Nights became his domain, where legality took a back seat, and the auto became his trusted sidekick and partner in adventure." [ref=f22e54]:
