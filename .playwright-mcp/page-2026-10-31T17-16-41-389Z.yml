        - generic [ref=f26e22]:
          - heading "Charanjeet Singh" [level=1] [ref=f26e23]
          - generic [ref=f26e24]:
            - paragraph [ref=f26e25]: Charanjeet Singh is a contemporary artist whose creations echo the whispers of history and advocate for water conservation. Drawing inspiration from the ancient step wells of India and the rich tradition of Mughal miniature paintings, Singh seamlessly weaves together these influences to convey a crucial message about the preservation of water and the timeless lessons of history.
            - paragraph [ref=f26e26]: EkChitra holds eleven works by Charanjeet Singh, in acrylic on paper, in two sizes, 16.5 x 12 inches and 15 x 11 inches. Each is shown in full under Selected works below, with its own title, medium and size.
            - paragraph [ref=f26e27]: Charanjeet Singh is represented by EkChitra in Hyderabad. Through the gallery's art advisory and bespoke sourcing, their work can be placed in homes, offices and institutions; to see a piece in person or ask what is available, enquire about any work below.
        - img "Portrait of Charanjeet Singh" [ref=f26e30]
