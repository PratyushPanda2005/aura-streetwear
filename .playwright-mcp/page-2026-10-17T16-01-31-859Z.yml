        - paragraph [ref=f15e81]: About Aspen
        - generic [ref=f15e83]:
          - generic [ref=f15e84]: "Aspen Search was founded on a simple observation: the best quantitative researchers and engineers don't apply to jobs. They get one shot every few years to make a move, and they want that conversation to be with someone who actually understands the work — the systems, the strategies, the tradeoffs, and the difference between a fund that will sharpen them and one that will stall them."
          - generic [ref=f15e85]: That's the bar we hold ourselves to. We've spent nearly two decades inside the hiring rooms of the top systematic firms and the venture-backed teams competing for the same minds. We don't pitch roles. We have honest conversations about where someone should spend the next five years of their career — and we're often the reason it's the right call.
