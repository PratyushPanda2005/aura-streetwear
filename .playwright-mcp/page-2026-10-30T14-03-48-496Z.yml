      - region "How we work" [ref=f34e47]:
        - list [ref=f34e48]:
          - listitem [ref=f34e49]:
            - paragraph [ref=f34e51]: ( How we work 01 )
            - generic [ref=f34e52]:
              - heading "We begin with looking." [level=3] [ref=f34e53]
              - paragraph [ref=f34e54]:
                - generic [ref=f34e55]: Curiosity
                - text: Every exhibition begins with an idea, and every visit begins with curiosity — you don’t need to know about art to feel at home here.
          - listitem [ref=f34e56]:
            - paragraph [ref=f34e58]: ( How we work 02 )
            - generic [ref=f34e59]:
              - heading "Every work belongs to a larger story." [level=3] [ref=f34e60]
              - paragraph [ref=f34e61]:
                - generic [ref=f34e62]: Context
                - text: From temple carvings and cinema posters to family photographs, textiles and handwritten signs, visual culture has always shaped how we understand identity, memory and belonging.
          - listitem [ref=f34e63]:
            - paragraph [ref=f34e65]: ( How we work 03 )
            - generic [ref=f34e66]:
              - heading "Art becomes meaningful when it enters a life." [level=3] [ref=f34e67]
              - paragraph [ref=f34e68]:
                - generic [ref=f34e69]: Connection
                - text: Art selection, curation and placement shaped around a particular space, and considered guidance for starting, refining or growing a collection.
          - listitem [ref=f34e70]:
            - paragraph [ref=f34e72]: ( How we work 04 )
            - generic [ref=f34e73]:
              - heading "A gallery is a place to exchange ideas." [level=3] [ref=f34e74]
              - paragraph [ref=f34e75]:
                - generic [ref=f34e76]: Conversation
                - text: Knowledgeable without being intimidating, and always open to a conversation — amplifying the voices of artists so their stories reach diverse audiences.
