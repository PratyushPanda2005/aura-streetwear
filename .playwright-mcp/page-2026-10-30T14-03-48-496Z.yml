    - generic [ref=f34e29]:
      - region [ref=f34e30]:
        - generic [ref=f34e31]:
          - paragraph [ref=f34e32]: ( Our story )
          - heading "EkChitra was founded with a vision to bridge the gap between exceptional contemporary Indian artists and art enthusiasts worldwide." [level=2] [ref=f34e33]
          - generic [ref=f34e34]:
            - paragraph [ref=f34e35]: "Our journey began with a simple belief: that art has the power to transform spaces, inspire minds, and connect souls."
            - paragraph [ref=f34e36]: Today, we proudly showcase a diverse collection of contemporary artworks, from bold abstracts to serene landscapes, each piece carefully curated to bring beauty and meaning into your life.
