        - generic [ref=f68e460]:
          - heading "Artist Bio" [level=2] [ref=f68e461]
          - region "Artist Bio" [ref=f68e462]:
            - generic [ref=f68e463]:
              - paragraph [ref=f68e464]: William Kentridge (b. 1955, Johannesburg, South Africa) is internationally acclaimed for his drawings, films, theatre, and opera productions.
              - paragraph [ref=f68e465]: In 2024, in Venice, Kentridge premiered a new nine-episode video series, 'Self-Portrait as a Coffee Pot' — a site-specific installation curated by long-time collaborator and curator Carolyn Christov-Bakargiev at the Arsenale Institute for Politics of Representation. Following this, in October, MUBI presented the New York premiere of 'William Kentridge’s Self-Portrait as a Coffee Pot'.
              - paragraph [ref=f68e466]: In conjunction with the world premiere of his newly commissioned opera, 'The Great Yes, The Great No', which debuted at LUMA Arles in July 2024, the solo exhibition 'Je n’attends plus' (I’m Not Waiting Any Longer) presented a collection of major works, some of which had not previously been seen in Europe.
              - paragraph [ref=f68e467]: Kentridge’s largest UK survey to date was held at the Royal Academy of Arts, London, in 2022. An iteration of the exhibition opened at the Taipei Fine Arts Museum in May 2024. In the same year, Kentridge opened another major survey exhibition, 'In Praise of Shadows', at The Broad, Los Angeles. In 2023, the exhibition travelled to the Museum of Fine Arts, Houston.
              - paragraph [ref=f68e468]: In 2025, he presented 'The Pull of Gravity' at Yorkshire Sculpture Park, marking the first museum presentation outside South Africa to focus on his sculpture.
              - paragraph [ref=f68e469]: Most recently, he opened 'I am not me, the horse is not mine' at Bozar in Brussels, Belgium and 'The Battle Between YES and NO' at Kunsthalle Praha, marking his first major exhibition in Czechia.
              - paragraph [ref=f68e470]: Kentridge’s work has been exhibited internationally since the 1990s, including at Kunsthalle Praha (2026); Staatliche Kunstsammlungen Dresden (2025); Museum Folkwang (2025); LUMA Foundation, France (2024); Arsenale Institute for Politics of Representation, Venice (2024); Taipei Fine Arts Museum (2024); Museum of Modern Art, New York (1999, 2005, 2010); Albertina Museum, Vienna (2010); Musée du Louvre, Paris (2010); National Museum of Modern and Contemporary Art, Korea; Museo Reina Sofía, Madrid (2015); Kunstmuseum Basel (2019); and Norval Foundation, Cape Town (2019). The artist has also participated in major biennales, including Documenta, Kassel (1997, 2002, 2012) and the Venice Biennale (1993, 1999, 2005, 2013, 2015).
              - paragraph [ref=f68e471]: Public collections include MoMA, New York; Tate Modern, London; Centre Pompidou, Paris; Haus der Kunst, Munich; Sharjah Art Foundation, Sharjah; National Museum of Modern Art, Kyoto; Guggenheim Abu Dhabi; and Zeitz MOCAA, Cape Town.
              - paragraph [ref=f68e472]: Kentridge lives and works in Johannesburg, South Africa.
