      - generic [ref=f68e366]: "\"Characterised by the artist as a return to basics, in particular to charcoal drawing and filmmaking, the exhibition includes a studio-like display of original drawings from A Nicely Built City (Never Resists Destruction).\""
      - img "William Kentridge soho film a nicely built city goodman gallery London" [ref=f68e371]
      - generic [ref=f68e375]:
        - generic [ref=f68e376]:
          - generic [ref=f68e377]: In the Studio
          - generic [ref=f68e378]:
            - generic [ref=f68e379]: William Kentridge
            - heading "Making ‘A Nicely Built City’ – premiering in London this September" [level=3] [ref=f68e380]
          - generic [ref=f68e383]: 03:25
        - 'button "Watch Film: Making ‘A Nicely Built City’ – premiering in London this September" [ref=f68e384] [cursor=pointer]'
      - generic [ref=f68e386]:
        - generic [ref=f68e389]:
          - paragraph [ref=f68e390]:
            - text: Developed and produced over nine months in the artist’s Johannesburg studio, the title for the new film is adapted from a West African proverb, “A nicely built city never resists destruction”. It forms part of an informal collection of aphorisms that Kentridge first used in an etching series published by Caversham Press in 1995. Repurposed and qualified with the introduction of parentheses,
            - emphasis [ref=f68e391]: A Nicely Built City (Never Resists Destruction)
            - text: immerses the viewer in contemporary Johannesburg, a post-colonial city racked by infrastructural and environmental challenges as it adapts from its foundational gold-mining economy.
          - paragraph
          - paragraph [ref=f68e392]: Merging social and personal biography, this elegiac film summons events familiar to the city’s dogged residents, including trees stricken by the fungus of a non-indigenous beetle and a fictional reimagining of the July 2023 methane gas explosion that destroyed parts of Bree Street in central Johannesburg. The action of the film moves between the turbulent commons of Johannesburg’s city streets and the sedate modernist home of industrialist Soho Eckstein, a central protagonist in Kentridge’s evolving cycle of films.
          - paragraph
          - paragraph [ref=f68e393]:
            - text: “In 1989, when I made
            - emphasis [ref=f68e394]: Johannesburg, 2nd Greatest City After Paris
            - text: ", Soho Eckstein was a much older man,” says Kentridge of his fictional protagonist and proxy for avarice. “I was the age of Felix Teitelbaum, the other protagonist in the early films. In the 37 years that have followed, Soho hasn’t really aged, but I have. What used to be a very external, antagonistic character has, over the years, by default, become closer to me. The challenge for me as an artist has always been to find a connection between my life and the life of Johannesburg, and the world of Soho in the films.”"
          - paragraph
          - paragraph [ref=f68e395]: Integral to the action of the film is Soho Eckstein’s unnamed black cat. It meanders between frames, in one scene offering comfort to Soho, in another dancing on its hind legs, and in yet another arriving like a herald before a violent inner-city explosion. The cat is a resident motif in Kentridge’s bountiful oeuvre, at once biographically linked to the childhood gift of a cat print by artist Cecil Skotnes and simply a convenient formal device.Music in the film soundtrack composed by Philip Miller.
        - img "William Kentridge London goodman gallery a nicely built city cat drawing charcoal" [ref=f68e399]
      - generic [ref=f68e401]:
        - paragraph [ref=f68e405]:
          - text: The presentation also includes a suite of six figural sculptures produced in collaboration with renowned Belgian costume designer Greta Goiris. Made from wood, fabric and found materials, the sculptures are based on studio models for costumes worn by actors portraying the spirits of the underworld in
          - emphasis [ref=f68e406]: L’Orfeo
          - text: . There is also a suite of composite ink drawings inventorying classical forms and figures appearing in the opera and linked to Kentridge’s bountiful visual language.
        - img "puppets William Kentridge goodman gallery London a nicely built city" [ref=f68e410]
      - generic [ref=f68e412]:
        - generic [ref=f68e415]:
          - paragraph [ref=f68e416]:
            - text: A recurring motif in Kentridge’s mature output, meriting a spotlight section in his 2022 survey exhibition at the Royal Academy in London, trees not only gesture to the leafy landscape of Houghton, where Kentridge lives and maintains a studio, but also connect to the figure of Eurydice. In Monteverdi’s opera
            - emphasis [ref=f68e417]: L’Orfeo
            - text: ", Orpheus journeys to Hades to retrieve his dead bride Eurydice, an oak tree nymph or dryad. Arboreal motifs also recur in"
            - emphasis [ref=f68e418]: A Nicely Built City (Never Resists Destruction)
            - text: ", a film in which ruined buildings – based on contemporary images of Caracas, Gaza, Johannesburg, Tehran and Tel Aviv – transform into trees."
          - paragraph
          - paragraph [ref=f68e419]:
            - text: The exhibition also gathers a number of works developed in relation to Kentridge’s production of
            - emphasis [ref=f68e420]: L’Orfeo
            - text: at the 2026 Glyndebourne Festival.
            - emphasis [ref=f68e421]: Orpheus, Eurydice, Hermes
            - text: (2026) is a new Pepper’s Ghost film installation integrating workshop footage for
            - emphasis [ref=f68e422]: L’Orfeo
            - text: filmed in Johannesburg with works on paper, sculpture and found paper ephemera. Part of a lineage of mechanised theatres, like
            - emphasis [ref=f68e423]: Black Box/Chambre Noire
            - text: (2005), the format of this work evolved out of theatre projects at The Centre for the Less Good Idea, an interdisciplinary incubator established in 2016 by the artist.
          - paragraph
          - paragraph [ref=f68e424]:
            - emphasis [ref=f68e425]: Orpheus, Eurydice, Hermes
            - text: is the third example of this nineteenth-century optical illusion utilising a pane of glass and strategic lighting to make objects appear or disappear on stage. It will be exhibited at the National Archaeological Museum, Athens, to coincide with
            - emphasis [ref=f68e426]: L’Orfeo
            - text: at the Greek National Opera, in November 2026. The title of the installation derives from Rainer Maria Rilke’s 1904 poem “Orpheus. Eurydice. Hermes”, fragments of which Kentridge projected as backdrop to his production of
            - emphasis [ref=f68e427]: L’Orfeo
            - text: .
        - img "William Kentridge goodman gallery London a nicely built city hologram orpheus" [ref=f68e431]
