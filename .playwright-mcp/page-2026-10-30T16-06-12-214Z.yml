                  - paragraph [ref=f62e239]: Follow Riya, a photographer in Pune, and Arjun's wedding video crew. Both are examples.
              - listitem [ref=f62e240]:
                - article [ref=f62e242]:
                  - generic [ref=f62e243]:
                    - img "Layered blue mountain ranges fading into the sky" [ref=f62e245]
                    - generic [ref=f62e246]: "[ Step 01 ]"
                  - generic [ref=f62e247]:
                    - heading "Enquiry" [level=3] [ref=f62e248]
                    - generic [ref=f62e249]: 01 / 07
                  - paragraph [ref=f62e250]: On Instagram, Krew replies with your “starting from” rates and portfolio, asks the date, budget and type of work, then hands the chat to you. It never agrees a price.
              - listitem [ref=f62e251]:
                - article [ref=f62e252]:
                  - generic [ref=f62e253]:
                    - img "Sand dunes below mountains under a cloudy sky" [ref=f62e255]
                    - generic [ref=f62e256]: "[ Step 02 ]"
                  - generic [ref=f62e257]:
                    - heading "Quote" [level=3] [ref=f62e258]
                    - generic [ref=f62e259]: 02 / 07
                  - paragraph [ref=f62e260]: Send the quote as a link. Your client accepts by typing their name and ticking a box, and Krew keeps a record of exactly what they accepted.
              - listitem [ref=f62e261]:
                - article [ref=f62e262]:
                  - generic [ref=f62e263]:
                    - img "White sand stretching to a mountain range" [ref=f62e265]
                    - generic [ref=f62e266]: "[ Step 03 ]"
                  - generic [ref=f62e267]:
                    - heading "Advance" [level=3] [ref=f62e268]
                    - generic [ref=f62e269]: 03 / 07
                  - paragraph [ref=f62e270]: Ask for the advance with a payment link or your UPI ID. If it isn't paid two days before the shoot, Krew marks the job at risk.
              - listitem [ref=f62e271]:
                - article [ref=f62e272]:
                  - generic [ref=f62e273]:
                    - img "Golden plains below snow-capped mountains" [ref=f62e275]
                    - generic [ref=f62e276]: "[ Step 04 ]"
                  - generic [ref=f62e277]:
                    - heading "Work" [level=3] [ref=f62e278]
                    - generic [ref=f62e279]: 04 / 07
                  - paragraph [ref=f62e280]: Turn the job into tasks from a template and assign them to your crew. Each person sees only the jobs and tasks you give them, and you choose who can reply to clients.
              - listitem [ref=f62e281]:
                - article [ref=f62e282]:
                  - generic [ref=f62e283]:
                    - img "Dark hills at dusk with the sea beyond" [ref=f62e285]
                    - generic [ref=f62e286]: "[ Step 05 ]"
                  - generic [ref=f62e287]:
                    - heading "Review" [level=3] [ref=f62e288]
                    - generic [ref=f62e289]: 05 / 07
                  - paragraph [ref=f62e290]: Share drafts by link. Clients comment on the exact second of a video or a spot on a photo, then approve, and that version is locked.
              - listitem [ref=f62e291]:
                - article [ref=f62e292]:
                  - generic [ref=f62e293]:
                    - img "The moon above pale dunes at dusk" [ref=f62e295]
                    - generic [ref=f62e296]: "[ Step 06 ]"
                  - generic [ref=f62e297]:
                    - heading "Invoice" [level=3] [ref=f62e298]
                    - generic [ref=f62e299]: 06 / 07
                  - paragraph [ref=f62e300]: Raise a GST invoice, or a plain one if you aren't registered, with a payment link for UPI or card.
              - listitem [ref=f62e301]:
                - article [ref=f62e302]:
                  - generic [ref=f62e303]:
                    - img "Jagged mountains behind grassy dunes and black sand" [ref=f62e305]
                    - generic [ref=f62e306]: "[ Step 07 ]"
                  - generic [ref=f62e307]:
                    - heading "Paid" [level=3] [ref=f62e308]
                    - generic [ref=f62e309]: 07 / 07
                  - paragraph [ref=f62e310]: Record the payment, and any TDS the client deducted, and the invoice settles. Every rupee in and out goes in your ledger.
              - listitem [ref=f62e311]:
