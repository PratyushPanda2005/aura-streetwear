        - generic [ref=f4e364]:
          - generic [ref=f4e365]: At Aspen Search, we don't just fill positions—we build careers and transform companies. We specialize in connecting exceptional engineering and research talent with the world's most innovative quantitative trading firms and venture-backed technology companies.
