        - heading "Statement" [level=2] [ref=f31e40]
        - paragraph [ref=f31e41]: Threadarte, which began as an experiment in 2004 to deal with textile waste, became Rahul and Gunjan’s unique language.
        - generic [ref=f31e42]:
          - paragraph [ref=f31e43]: They collect and sort waste yarns from various sources and integrate them through manual process, incorporating coloured and textured yarns, strips of fabric, metallic threads and metals to create painterly installations.
          - paragraph [ref=f31e44]: Rahul & Gunjan are represented by EkChitra in Hyderabad. Through the gallery's art advisory and bespoke sourcing, their work can be placed in homes, offices and institutions; to see a piece in person or ask what is available, enquire about any work below.
