        - generic [ref=f40e13]:
          - paragraph [ref=f40e14]: ( Our story )
          - heading "EkChitra was founded with a vision to bridge the gap between exceptional contemporary Indian artists and art enthusiasts worldwide." [level=2] [ref=f40e15]
          - generic [ref=f40e16]:
            - paragraph [ref=f40e17]: "Our journey began with a simple belief: that art has the power to transform spaces, inspire minds, and connect souls."
            - paragraph [ref=f40e18]: Today, we proudly showcase a diverse collection of contemporary artworks, from bold abstracts to serene landscapes, each piece carefully curated to bring beauty and meaning into your life.
