      - region "How we work" [ref=f40e29]:
        - list [ref=f40e30]:
          - listitem [ref=f40e31]:
            - paragraph [ref=f40e33]: ( How we work 01 )
            - generic [ref=f40e34]:
              - heading "We begin with looking." [level=3] [ref=f40e35]
              - paragraph [ref=f40e36]:
                - generic [ref=f40e37]: Curiosity
                - text: Every exhibition begins with an idea, and every visit begins with curiosity — you don’t need to know about art to feel at home here.
          - listitem [ref=f40e38]:
            - paragraph [ref=f40e40]: ( How we work 02 )
            - generic [ref=f40e41]:
              - heading "Every work belongs to a larger story." [level=3] [ref=f40e42]
              - paragraph [ref=f40e43]:
                - generic [ref=f40e44]: Context
                - text: From temple carvings and cinema posters to family photographs, textiles and handwritten signs, visual culture has always shaped how we understand identity, memory and belonging.
          - listitem [ref=f40e45]:
            - paragraph [ref=f40e47]: ( How we work 03 )
            - generic [ref=f40e48]:
              - heading "Art becomes meaningful when it enters a life." [level=3] [ref=f40e49]
              - paragraph [ref=f40e50]:
                - generic [ref=f40e51]: Connection
                - text: Art selection, curation and placement shaped around a particular space, and considered guidance for starting, refining or growing a collection.
          - listitem [ref=f40e52]:
            - paragraph [ref=f40e54]: ( How we work 04 )
            - generic [ref=f40e55]:
              - heading "A gallery is a place to exchange ideas." [level=3] [ref=f40e56]
              - paragraph [ref=f40e57]:
                - generic [ref=f40e58]: Conversation
                - text: Knowledgeable without being intimidating, and always open to a conversation — amplifying the voices of artists so their stories reach diverse audiences.
