            - paragraph [ref=f3e106]: Do you take on small projects?
            - paragraph [ref=f3e109]: We’re flexible. Whether you need a complete identity or just a standout landing page, we’ll tailor our process to fit your scope — without compromising quality.
          - generic [ref=f3e111] [cursor=pointer]:
            - paragraph [ref=f3e115]: Can you work with an existing brand?
            - paragraph [ref=f3e118]: Yes — we love working with existing brands. Whether you have a full identity system or just a logo and a color palette, we can build upon your foundation and create visuals, campaigns, or digital experiences that stay true to your brand while elevating it in fresh and strategic ways.
          - generic [ref=f3e120] [cursor=pointer]:
            - paragraph [ref=f3e124]: What’s your typical project timeline?
            - paragraph [ref=f3e127]: It depends on the size and complexity, but most projects take 2–6 weeks. We’ll always set clear milestones before we start — no surprises.
          - generic [ref=f3e129] [cursor=pointer]:
            - paragraph [ref=f3e133]: What happens after I reach out?
            - paragraph [ref=f3e136]: We’ll reply within a day or two to learn more about your project. If it’s a good fit, we’ll suggest a quick call to discuss scope, timeline, and next steps.
          - generic [ref=f3e138] [cursor=pointer]:
            - paragraph [ref=f3e142]: Do you offer free consultations or discovery calls?
            - paragraph [ref=f3e145]: Yes, we do! Once we understand a bit about your project, we’ll set up a short call to explore how we can help — no pressure, no strings.
          - generic [ref=f3e147] [cursor=pointer]:
            - paragraph [ref=f3e151]: Can I reach out if I’m not sure what I need yet?
            - paragraph [ref=f3e154]: Absolutely. Whether you have a clear brief or just a loose idea, we’re happy to explore it with you. No pressure — just a conversation.
