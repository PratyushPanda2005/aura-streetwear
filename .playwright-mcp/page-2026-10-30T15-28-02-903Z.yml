              - paragraph: 12 / 15
              - heading [level=2]: Sarvanan Parasuraman
              - paragraph: Paper Board
              - paragraph: “Modified Continuity” is a series of artworks that emerges from their attempts to continually refine and elevate their stance on the things they once believed, practiced, achieved, or experienced — recognising that what persists is essentially an extension of what came before.
