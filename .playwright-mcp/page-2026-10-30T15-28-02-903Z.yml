              - paragraph: Stainless Steel and Corten Steel
              - paragraph: He has over 22 years of experience in traditional and digital sculpting. His journey began with a strong foundation in clay and fine arts; he has been recognised internationally with two awards in watercolour painting, and contributed to Hollywood productions including Boss Baby, Puss in Boots and Kung Fu Panda.
