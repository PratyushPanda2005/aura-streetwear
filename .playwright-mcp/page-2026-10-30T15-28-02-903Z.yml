              - heading [level=2]: Rahul & Gunjan
              - paragraph: Collected Wool Silk, Linen, Cotton & Steel
              - paragraph: Threadarte, which began as an experiment in 2004 to deal with textile waste, became Rahul and Gunjan’s unique language. They collect and sort waste yarns from various sources and integrate them through manual process, incorporating coloured and textured yarns, strips of fabric, metallic threads and metals to create painterly installations.
