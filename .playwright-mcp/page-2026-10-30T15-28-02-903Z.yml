              - heading [level=2]: Manish Sharma
              - paragraph: Wood, Iron, Acrylic and PU
              - paragraph: His art poignantly explores themes of nostalgia and cultural preservation. Born in the culturally rich town of Bikaner, Rajasthan, Sharma has witnessed the rapid changes and cultural erosion in his hometown, and emphasizes the importance of safeguarding cultural identity and history in the face of globalization.
