              - heading [level=2]: Rajesh Naik
              - paragraph: Metal
              - paragraph: Born in the suburbs of Hyderabad, the artist began supporting his family from an early age, driving an autorickshaw at night. This early immersion into the gritty realities of life exposed him to a unique local ghetto culture, and his focus has always been on using art to make a meaningful difference.
