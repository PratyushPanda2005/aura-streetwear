              - heading [level=2]: Chandrapal Panjre
              - paragraph: Mixed Media
              - paragraph: Artwork-making is an enjoyable and meditative process for him. The elements of his artwork represent rural lifestyle and rural culture. What he creates is a map of his inner exploration — his own world. He pieces together scraps of cloth as if they were canvas and colours, and travels through them with a needle and thread.
