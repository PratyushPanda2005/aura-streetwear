              - paragraph: Acrylic, Fabric & Acid Wash · Acrylic Ink & Acrylic Pens
              - paragraph: Their works are postmodernist explorations, lightly touched by notions of deconstructionism, where the artist unravels surfaces that bear the scars and whispers of time’s passage, rock faces eroded by wind, walls peeling under neglect, cave paintings fading into myth, and traditional art on village homes weathered by the elements.
