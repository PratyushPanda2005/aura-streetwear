              - paragraph: Acrylic
              - paragraph: Dilipkumar Kesavan is an artist based in Chennai whose work is deeply rooted in the textures and stories of his surroundings. His creative process begins each day with his journey along the scenic coastal road to his studio in Mahabalipuram, filled with sights of swaying palms, scattered shells, and vibrant greens.
