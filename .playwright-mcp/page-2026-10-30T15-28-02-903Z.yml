              - heading [level=2]: Parul Kaur
              - paragraph: Watercolor
              - paragraph: Parul Kaur is a Baroda-based artist currently working in Surat. Watercolour is her primary medium, through which she explores how artificial, temporary, and man-made interventions affect the human mind and shape emotional responses.
