  - main [ref=f26e124]:
    - generic [ref=f26e129]:
      - generic [ref=f26e130]: ( The studio )
      - heading "Built to holdtogether." [level=1] [ref=f26e131]:
        - generic [aria-hidden] [ref=f26e132]: Built to hold
        - generic [aria-hidden] [ref=f26e133]: together.
    - generic [ref=f26e138]:
      - heading "Our philosophy." [level=2] [ref=f26e140]:
        - generic [aria-hidden] [ref=f26e141]: Our philosophy.
      - paragraph [ref=f26e143]: Vantra takes on the whole system, not a piece of it. The same senior team stays on the work from the first meeting to launch.
    - generic [ref=f26e148]:
      - generic [ref=f26e150]:
        - generic [ref=f26e151]: ( Core value 01 )
        - generic [ref=f26e153]:
          - heading "Fewer people, further in." [level=2] [ref=f26e155]:
            - generic [aria-hidden] [ref=f26e156]: Fewer people,
            - generic [aria-hidden] [ref=f26e157]: further in.
          - paragraph [ref=f26e160]: A project runs with three or four seniors, not a rotating cast. The people in the first meeting are the people who ship it, and nothing is handed down mid-flight. Fewer hands means fewer translations, and every decision keeps the context that produced it.
      - generic [ref=f26e162]:
        - generic [ref=f26e163]: ( Core value 02 )
        - generic [ref=f26e165]:
          - heading "Decide slowly, once." [level=2] [ref=f26e167]:
            - generic [aria-hidden] [ref=f26e168]: Decide slowly,
            - generic [aria-hidden] [ref=f26e169]: once.
          - paragraph [ref=f26e172]: Positioning takes the time it takes. Everything downstream moves faster when the argument underneath it is settled, so we hold the first decision until it holds. Once it does, identity and interface stop being opinions and start being consequences.
      - generic [ref=f26e174]:
        - generic [ref=f26e175]: ( Core value 03 )
        - generic [ref=f26e177]:
          - heading "Draw what ships." [level=2] [ref=f26e179]:
            - generic [aria-hidden] [ref=f26e180]: Draw what
            - generic [aria-hidden] [ref=f26e181]: ships.
          - paragraph [ref=f26e184]: We work in the browser with your engineers from the second week, so what gets approved in review is what goes live. No redraw between sign-off and launch, no handover document standing in for the thing itself, and no surprises in the last fortnight.
      - generic [ref=f26e186]:
        - generic [ref=f26e187]: ( Core value 04 )
        - generic [ref=f26e189]:
          - heading "Own the whole system." [level=2] [ref=f26e191]:
            - generic [aria-hidden] [ref=f26e192]: Own the whole
            - generic [aria-hidden] [ref=f26e193]: system.
          - paragraph [ref=f26e196]: "Identity, interface, and content are one problem. We take all three, or we say no and recommend someone else. A system that only half exists does not hold: the parts drift, the rules get reinterpreted, and a year later nothing reads as one brand."
