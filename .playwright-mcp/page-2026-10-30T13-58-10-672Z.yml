    - generic [ref=f29e49]:
      - generic [ref=f29e50]:
        - heading "Have we been looking at plants all wrong?" [level=3] [ref=f29e51]
        - generic [ref=f29e53]:
          - paragraph [ref=f29e54]:
            - generic [ref=f29e55]: Inheritors of Earth
            - text: ", curated by Premjish Achari, invites viewers into the relational world of plants, entities long treated as backdrop, resource, or specimen rather than co-inhabitants of the earth. The title draws on Vaikom Muhammad Basheer’s"
            - generic [ref=f29e56]: Bhumiyude Avakashikal
            - text: ", envisioning humans, flora and fauna as equal co-custodians of the planet, and on ecological activist Kallen Pokkudan, whose mangrove-planting work fused Dalit history with ecological repair."
          - paragraph [ref=f29e57]: "Through paintings, photographs, installations and video, artists here practice a “phytosensitive” approach: encountering rather than merely representing plants, tracing colonial botanical migrations, and honoring uncredited lower-caste knowledge-keepers erased from scientific archives."
          - paragraph [ref=f29e58]
          - iframe [ref=f29e60]: <br />
          - paragraph [ref=f29e61]
          - paragraph [ref=f29e62]:
            - text: Rejecting both extraction and exoticism, the exhibition asks viewers to look
            - generic [ref=f29e63]: with
            - text: plants, not just at them, moving from usefulness and utility toward humility, kinship, and coexistence—imagining a future shaped by plant life on its own terms.
          - paragraph [ref=f29e64]: The exhibition is proud to host a set of artworks from the Shared Ecologies archive as part of an extended reading room. Ben Goldfarb has designed a special soundscape for the exhibition. Independent curator and researcher Oorja Garg and IMPULSE Magazine, New York are leading a special reading group for the duration of the exhibition.
          - generic [ref=f29e65]: Museum FAQs
          - generic [ref=f29e68]: Exhibition FAQs
